name: Keep Supabase alive

# Evita que o projeto Supabase (plano grátis) seja pausado por inatividade.
# Faz um ping leve no banco a cada 3 dias (e permite rodar manualmente).
# Configure os secrets do repositório: SUPABASE_URL e SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: "0 6 */3 * *"   # a cada 3 dias, 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL ou SUPABASE_ANON_KEY não estão configurados em Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Limpa espaços em branco e remove eventuais barras finais da URL
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::')

          echo "Disparando ping para o Supabase..."
          
          # Consulta leve na tabela banners com retry automático (conta como atividade real no banco)
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            "$CLEAN_URL/rest/v1/banners?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "curl_error")

          echo "Código retornado: $code"

          if [ "$code" = "curl_error" ]; then
            echo "::error::Falha de conexão com o Supabase (curl retornou erro). Se o projeto estiver pausado no painel, despause-o manualmente primeiro."
            exit 1
          fi

          # 200/206/204 (OK) ou 401/403/404 (banco processou a requisição) contam como atividade ativa no Postgres
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "::error::Ping falhou com HTTP $code."
            exit 1
          fi

          echo "Ping realizado com sucesso (HTTP $code) — projeto mantido ativo."
