name: Keep Supabase alive

# Evita que o projeto Supabase (plano grátis) seja pausado por inatividade.
# Faz um ping leve no banco a cada 3 dias (e permite rodar manualmente).
# Configure os secrets do repositório: SUPABASE_URL e SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: "0 6 */3 * *"   # a cada 3 dias, 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL ou SUPABASE_ANON_KEY não estão configurados em Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Limpa espaços em branco e remove eventuais barras finais da URL
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::')

          echo "Disparando ping para o Supabase..."
          
          # Escreve na tabela heartbeat (supabase/sql/heartbeat.sql): atividade real de escrita no banco.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -sS -o resp.json -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 30 \
            -X PATCH "$CLEAN_URL/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"ping\":\"$NOW\"}") || code="000"

          echo "Código retornado: $code"
          cat resp.json 2>/dev/null; echo

          # 000 (sem conexão), 5xx e 52x (Cloudflare: origem fora do ar) = projeto pausado ou banco fora.
          case "$code" in
            200) ;;
            000|5*)
              echo "::error::Ping falhou (HTTP $code). Provavelmente o projeto está PAUSADO: abra o painel do Supabase e clique em Restore project."
              exit 1
              ;;
            *)
              echo "::error::Ping falhou (HTTP $code). Confira os secrets SUPABASE_URL/SUPABASE_ANON_KEY e se supabase/sql/heartbeat.sql foi rodado."
              exit 1
              ;;
          esac

          # PATCH em linha inexistente devolve 200 com []: tratar como erro.
          if ! grep -q '"ping"' resp.json; then
            echo "::error::Nenhuma linha atualizada. Rode supabase/sql/heartbeat.sql no SQL Editor."
            exit 1
          fi

          echo "Ping realizado com sucesso — projeto mantido ativo."
